<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base grid — 10 steps" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing · 4px grid</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .scale { display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 16px; }
  .bar { background: var(--brand-green); height: 12px; border-radius: 2px; }
  .label { font-family: var(--font-mono); font-size: 11px; min-width: 64px; color: var(--fg-2); }
  .value { font-family: var(--font-mono); font-size: 11px; color: var(--fg-0); }
</style>
</head>
<body class="card">
  <div class="eyebrow">Spacing · 4px base grid</div>
  <div class="scale">
    <div class="step"><span class="label">space-1</span><span class="bar" style="width:4px"></span><span class="value">4px</span></div>
    <div class="step"><span class="label">space-2</span><span class="bar" style="width:8px"></span><span class="value">8px</span></div>
    <div class="step"><span class="label">space-3</span><span class="bar" style="width:12px"></span><span class="value">12px</span></div>
    <div class="step"><span class="label">space-4</span><span class="bar" style="width:16px"></span><span class="value">16px</span></div>
    <div class="step"><span class="label">space-5</span><span class="bar" style="width:24px"></span><span class="value">24px</span></div>
    <div class="step"><span class="label">space-6</span><span class="bar" style="width:32px"></span><span class="value">32px</span></div>
    <div class="step"><span class="label">space-7</span><span class="bar" style="width:48px"></span><span class="value">48px</span></div>
    <div class="step"><span class="label">space-8</span><span class="bar" style="width:64px"></span><span class="value">64px</span></div>
    <div class="step"><span class="label">space-9</span><span class="bar" style="width:96px"></span><span class="value">96px</span></div>
    <div class="step"><span class="label">space-10</span><span class="bar" style="width:128px"></span><span class="value">128px</span></div>
  </div>
</body>
</html>
