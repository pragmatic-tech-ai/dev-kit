<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, danger — with sizes" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Buttons</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .btn {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    padding: 9px 14px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--brand-green); color: #fff; }
  .btn-primary:hover { background: var(--brand-green-hover); }
  .btn-primary:active { background: var(--brand-green-press); }
  .btn-secondary { background: var(--bg-1); color: var(--fg-0); border-color: var(--border-strong); }
  .btn-secondary:hover { border-color: var(--neutral-500); }
  .btn-ghost { background: transparent; color: var(--fg-1); }
  .btn-ghost:hover { background: var(--bg-2); }
  .btn-danger { background: transparent; color: var(--state-danger); border-color: var(--state-danger); }
  .btn-danger:hover { background: var(--state-danger-soft); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px; }
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
</style>
</head>
<body class="card">
  <div class="eyebrow">Buttons</div>
  <div class="card-row" style="gap:18px;">
    <div class="col"><button class="btn btn-primary">Save changes</button><span class="label">primary</span></div>
    <div class="col"><button class="btn btn-secondary">Cancel</button><span class="label">secondary</span></div>
    <div class="col"><button class="btn btn-ghost">Skip</button><span class="label">ghost</span></div>
    <div class="col"><button class="btn btn-danger">Delete map</button><span class="label">danger</span></div>
  </div>
  <div class="card-row" style="gap:18px;">
    <div class="col"><button class="btn btn-primary" style="font-size:13px; padding:7px 12px;">Save</button><span class="label">sm</span></div>
    <div class="col"><button class="btn btn-primary" style="font-size:15px; padding:11px 18px;">Save changes</button><span class="label">lg</span></div>
    <div class="col"><button class="btn btn-secondary" disabled style="opacity:0.5; cursor:not-allowed;">Disabled</button><span class="label">disabled</span></div>
  </div>
</body>
</html>
