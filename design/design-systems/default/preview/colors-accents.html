<!doctype html>
<!-- @dsCard group="Colors" name="Accents & data viz" subtitle="Cyan, lime, and 5-step categorical viz palette" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Colors · Accents & Data viz</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .swatch.lg { height: 80px; }
  .vizrow { display: flex; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .vizrow > div { flex: 1; }
</style>
</head>
<body class="card">
  <div class="eyebrow">Accents · Cyan & Plum</div>
  <div class="card-row">
    <div class="swatch lg" style="background:#E2F1F4; color:#22211E"><div class="name">cyan-soft</div><div class="val">#E2F1F4</div></div>
    <div class="swatch lg" style="background:#3AA6B9; color:white"><div class="name">cyan</div><div class="val">#3AA6B9</div></div>
    <div class="swatch lg" style="background:#EEEAF5; color:#22211E"><div class="name">plum-soft</div><div class="val">#EEEAF5</div></div>
    <div class="swatch lg" style="background:#7C6BAD; color:#22211E"><div class="name">plum</div><div class="val">#7C6BAD</div></div>
  </div>
  <div class="eyebrow" style="margin-top:6px;">Data viz · 5-step categorical</div>
  <div class="vizrow">
    <div style="background:#2EA862"></div>
    <div style="background:#3AA6B9"></div>
    <div style="background:#7C6BAD"></div>
    <div style="background:#5F5C56"></div>
    <div style="background:#C68A0E"></div>
  </div>
  <div class="sm muted">Order matters — green leads (the brand), then cyan, plum, neutral, warning. Avoid using more than 5 series in a single chart.</div>
</body>
</html>
