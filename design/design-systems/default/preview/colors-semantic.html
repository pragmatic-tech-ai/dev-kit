<!doctype html>
<!-- @dsCard group="Colors" name="Semantic state colors" subtitle="Success, warning, danger, info — base + soft" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Colors · Semantic state</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch.lg { height: 80px; }
</style>
</head>
<body class="card">
  <div class="eyebrow">Semantic · State</div>
  <div class="grid2">
    <div class="swatch lg" style="background:#E8F2E2; color:#22211E"><div class="name">success-soft</div><div class="val">#E8F2E2</div></div>
    <div class="swatch lg" style="background:#4A8E3A; color:white"><div class="name">success</div><div class="val">#4A8E3A</div></div>
    <div class="swatch lg" style="background:#FBF1D8; color:#22211E"><div class="name">warning-soft</div><div class="val">#FBF1D8</div></div>
    <div class="swatch lg" style="background:#C68A0E; color:white"><div class="name">warning</div><div class="val">#C68A0E</div></div>
    <div class="swatch lg" style="background:#FBE4DF; color:#22211E"><div class="name">danger-soft</div><div class="val">#FBE4DF</div></div>
    <div class="swatch lg" style="background:#C24532; color:white"><div class="name">danger</div><div class="val">#C24532</div></div>
    <div class="swatch lg" style="background:#E2F1F4; color:#22211E"><div class="name">info-soft</div><div class="val">#E2F1F4</div></div>
    <div class="swatch lg" style="background:#3AA6B9; color:white"><div class="name">info</div><div class="val">#3AA6B9</div></div>
  </div>
</body>
</html>
