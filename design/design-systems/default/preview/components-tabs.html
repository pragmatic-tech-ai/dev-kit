<!doctype html>
<!-- @dsCard group="Components" name="Tabs, segmented, toggle" subtitle="Underline tabs, segmented control, switch" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Tabs & toggle</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab {
    font-family: var(--font-sans); font-size: 13px;
    padding: 10px 14px; color: var(--fg-2);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; transition: color var(--duration-fast) var(--ease-out);
  }
  .tab:hover { color: var(--fg-0); }
  .tab.active { color: var(--fg-0); border-bottom-color: var(--brand-green); font-weight: 500; }
  .tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-left: 6px; }

  .seg { display: inline-flex; padding: 3px; background: var(--bg-2); border-radius: var(--radius-md); border: 1px solid var(--border); }
  .seg button {
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    padding: 5px 12px; border: 0; background: transparent; border-radius: var(--radius-sm);
    color: var(--fg-2); cursor: pointer;
  }
  .seg button.on { background: var(--bg-1); color: var(--fg-0); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

  .toggle { width: 32px; height: 18px; background: var(--neutral-300); border-radius: 999px; position: relative; transition: background var(--duration-fast) var(--ease-out); }
  .toggle.on { background: var(--brand-green); }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; background: #fff; border-radius: 999px; transition: transform var(--duration-fast) var(--ease-out); }
  .toggle.on::after { transform: translateX(14px); }

  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body class="card">
  <div class="eyebrow">Tabs · segmented · toggle</div>
  <div class="tabs">
    <div class="tab active">Map<span class="count">142</span></div>
    <div class="tab">ADRs<span class="count">38</span></div>
    <div class="tab">Services<span class="count">61</span></div>
    <div class="tab">Activity</div>
  </div>
  <div class="row">
    <div class="seg"><button class="on">Light</button><button>Dark</button><button>System</button></div>
    <div class="row" style="gap:8px"><span class="sm">Auto-save</span><div class="toggle on"></div></div>
    <div class="row" style="gap:8px"><span class="sm muted">Beta features</span><div class="toggle"></div></div>
  </div>
</body>
</html>
