<!doctype html>
<!-- @dsCard group="Colors" name="Neutral ramp" subtitle="12-step warm-cool ramp, paper to ink" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Colors · Neutral ramp</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .ramp { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .ramp .swatch { height: 72px; padding: 6px 6px; font-size: 9px; border-radius: var(--radius-sm); }
</style>
</head>
<body class="card">
  <div class="eyebrow">Neutrals · Paper to Ink</div>
  <div class="ramp">
    <div class="swatch" style="background:#FFFFFF; color:#22211E"><div class="name">0</div><div class="val">#FFFFFF</div></div>
    <div class="swatch" style="background:#FAFAF9; color:#22211E"><div class="name">50</div><div class="val">#FAFAF9</div></div>
    <div class="swatch" style="background:#F4F4F2; color:#22211E"><div class="name">100</div><div class="val">#F4F4F2</div></div>
    <div class="swatch" style="background:#E9E8E4; color:#22211E"><div class="name">200</div><div class="val">#E9E8E4</div></div>
    <div class="swatch" style="background:#D6D5D0; color:#22211E"><div class="name">300</div><div class="val">#D6D5D0</div></div>
    <div class="swatch" style="background:#B5B3AC; color:#22211E"><div class="name">400</div><div class="val">#B5B3AC</div></div>
    <div class="swatch" style="background:#8A8780; color:white"><div class="name">500</div><div class="val">#8A8780</div></div>
    <div class="swatch" style="background:#5F5C56; color:white"><div class="name">600</div><div class="val">#5F5C56</div></div>
    <div class="swatch" style="background:#3D3B36; color:white"><div class="name">700</div><div class="val">#3D3B36</div></div>
    <div class="swatch" style="background:#22211E; color:white"><div class="name">800</div><div class="val">#22211E</div></div>
    <div class="swatch" style="background:#141312; color:white"><div class="name">900</div><div class="val">#141312</div></div>
    <div class="swatch" style="background:#0A0A0B; color:white"><div class="name">1000</div><div class="val">#0A0A0B</div></div>
  </div>
  <div class="sm muted">Slightly warm. Does ~80% of the visual lifting — backgrounds, text, borders, dividers.</div>
</body>
</html>
