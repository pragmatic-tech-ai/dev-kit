<!doctype html>

<html lang="en">
<head>

<title>Brand · Logomark</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .lockup-row { display: flex; align-items: center; gap: 24px; }
  .mark-tile {
    width: 120px; height: 120px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg-1);
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-0);
  }
  .mark-tile.dark { background: var(--neutral-1000); color: var(--neutral-50); }
  .mark-tile svg { width: 64px; height: 64px; }
  .mark-meta { display: flex; flex-direction: column; gap: 6px; }
  .owl-svg { width: 64px; height: 64px; }
</style>
</head>
<body class="card">
  <div class="lockup-row">
    <div class="mark-tile">
      <svg class="owl-svg" viewBox="0 0 64 64" fill="none">

    <div class="mark-tile dark">

      <div class="eyebrow">Logomark · Owl</div>
      <div style="font-size:15px; max-width:340px;">A geometric owl — rounded head, two ear tufts, a small beak. The right eye is Signal Green. Owls signal pragmatic wisdom: see in the dark, turn the head, decide.</div>
