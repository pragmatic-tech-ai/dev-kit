<!doctype html>
<!-- @dsCard group="UI Kit — App" name="Atlas app" subtitle="Three-column workspace — sidebar, capability map, inspector" viewport="1280x720" -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atlas — Pragmatic Labs</title>
<link rel="icon" href="../../assets/favicon.svg"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
  function App() {
    const [view, setView] = React.useState('map');
    const [selectedId, setSelectedId] = React.useState('billing');
    const [paletteOpen, setPaletteOpen] = React.useState(false);
    const [zoom, setZoom] = React.useState(100);

    React.useEffect(() => {
      const onKey = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen(true); }
        if (e.key === 'Escape') setPaletteOpen(false);
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);

    React.useEffect(() => { if (window.lucide) lucide.createIcons(); });

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }} data-screen-label="Atlas — Workspace">
        <AppShell onOpenPalette={() => setPaletteOpen(true)}/>
        <div style={{ display: 'flex', flex: 1, minHeight: 0 }}>
          <Sidebar active={view} onChange={setView}/>
          {view === 'adrs' ? (
            <ADRList/>
          ) : (
            <>
              <div style={{ position: 'relative', flex: 1, minWidth: 0, display: 'flex' }}>
                <Canvas selectedId={selectedId} onSelect={setSelectedId}/>
                <Toolbar zoom={zoom} onZoom={(z) => setZoom(Math.max(25, Math.min(400, z)))}/>
              </div>
              <Inspector nodeId={selectedId}/>
            </>
          )}
        </div>
        <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)}/>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
