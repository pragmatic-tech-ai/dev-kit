<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../design-systems/default/colors_and_type.css">
</helmet>
<div style="position:relative;width:1920px;height:1080px;background:#0A0A0B;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);background-size:26px 26px;opacity:0.5;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 42%, rgba(46,168,98,0.06), transparent 70%);"></div>
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div style="position:absolute;inset:0;box-shadow:inset 0 0 320px 60px rgba(10,10,11,0.9);pointer-events:none;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;medium&quot;,&quot;options&quot;:[&quot;sparse&quot;,&quot;medium&quot;,&quot;dense&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Graph&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;green&quot;,&quot;options&quot;:[&quot;mono&quot;,&quot;green&quot;,&quot;multi&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Graph&quot;}}">
class Component extends DCLogic {
  canvasRef = React.createRef();

  renderVals() {
    return { canvasRef: this.canvasRef };
  }

  componentDidMount() {
    const canvas = this.canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const W = 1920, H = 1080;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const density = this.props.density ?? 'medium';
    const N = density === 'sparse' ? 42 : density === 'dense' ? 130 : 78;
    const animate = this.props.animate ?? true;
    const accent = this.props.accent ?? 'green';

    // muted palette on near-black
    const palettes = {
      mono:  ['46,168,98'],
      green: ['46,168,98', '46,168,98', '58,166,185'],
      multi: ['46,168,98', '58,166,185', '124,107,173'],
    };
    const cols = palettes[accent] || palettes.green;
    const pick = () => cols[Math.floor(Math.random() * cols.length)];

    const nodes = [];
    for (let i = 0; i < N; i++) {
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.14,
        vy: (Math.random() - 0.5) * 0.14,
        r: Math.random() < 0.14 ? 3.2 + Math.random() * 2.4 : 1.1 + Math.random() * 1.6,
        col: pick(),
        ph: Math.random() * Math.PI * 2,
        sp: 0.4 + Math.random() * 0.8,
      });
    }

    const LINK = 168; // connection radius
    let raf, t = 0;

    const draw = () => {
      t += 0.016;
      ctx.clearRect(0, 0, W, H);

      if (animate) {
        for (const n of nodes) {
          n.x += n.vx; n.y += n.vy;
          if (n.x < -20) n.x = W + 20; if (n.x > W + 20) n.x = -20;
          if (n.y < -20) n.y = H + 20; if (n.y > H + 20) n.y = -20;
        }
      }

      // edges
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.hypot(dx, dy);
          if (d < LINK) {
            const base = (1 - d / LINK) * 0.32;
            const pulse = animate ? 0.6 + 0.4 * Math.sin(t * 0.9 + (a.ph + b.ph)) : 1;
            ctx.strokeStyle = `rgba(${a.col},${(base * pulse).toFixed(3)})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      // nodes
      for (const n of nodes) {
        const glow = animate ? 0.55 + 0.45 * Math.sin(t * n.sp + n.ph) : 0.8;
        if (n.r > 3) {
          const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 6);
          g.addColorStop(0, `rgba(${n.col},${(0.22 * glow).toFixed(3)})`);
          g.addColorStop(1, `rgba(${n.col},0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r * 6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = `rgba(${n.col},${(0.5 + 0.4 * glow).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (animate) raf = requestAnimationFrame(draw);
    };

    draw();
    this._raf = () => raf;
    if (!animate) return;
  }

  componentWillUnmount() {
    if (this._raf) cancelAnimationFrame(this._raf());
  }
}
</script>
</body>
</html>
