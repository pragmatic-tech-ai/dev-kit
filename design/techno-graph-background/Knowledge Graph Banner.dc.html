<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../design-systems/default/colors_and_type.css">
  <script src="../design-systems/default/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:1920px;height:360px;background:#0A0A0B;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);background-size:24px 24px;opacity:0.6;"></div>
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div style="position:absolute;inset:0;box-shadow:inset 0 0 90px 10px rgba(10,10,11,0.92);pointer-events:none;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:360},&quot;guides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;relations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Graph&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dense&quot;,&quot;options&quot;:[&quot;sparse&quot;,&quot;medium&quot;,&quot;dense&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Graph&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;green&quot;,&quot;options&quot;:[&quot;mono&quot;,&quot;green&quot;,&quot;multi&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Graph&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Graph&quot;}}">
class Component extends DCLogic {
  canvasRef = React.createRef();
  renderVals() { return { canvasRef: this.canvasRef }; }
  componentDidMount() { this.build(); }
  componentDidUpdate(p) {
    if (['density', 'accent', 'animate', 'seed', 'relations', 'guides'].some(k => p[k] !== this.props[k])) this.build();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  build() {
    cancelAnimationFrame(this.raf);
    const canvas = this.canvasRef.current; if (!canvas) return;
    const W = 1920, H = 360;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let s = (this.props.seed ?? 7) * 2654435761 >>> 0;
    const rnd = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const pick = a => a[Math.floor(rnd() * a.length)];
    const density = this.props.density ?? 'dense';
    const accent = this.props.accent ?? 'green';
    const animate = this.props.animate ?? true;
    const showRel = this.props.relations ?? true;
    const [nHub, kids, cross] = { sparse: [8, 3, 6], medium: [11, 4, 12], dense: [14, 5, 20] }[density] || [11, 4, 12];

    const GREEN = '46,168,98', CYAN = '58,166,185', PLUM = '124,107,173', GREY = '160,164,170';
    const hubCols = accent === 'mono' ? [GREEN] : accent === 'multi' ? [GREEN, CYAN, PLUM] : [GREEN, GREEN, CYAN];
    const concepts = ['Capability', 'Domain', 'Decision', 'Principle', 'Standard', 'Process', 'Data entity', 'Actor', 'Requirement', 'Risk', 'Interface'];
    const entities = ['Billing', 'Identity', 'ADR-014', 'Order', 'Customer', 'API gateway', 'GDPR', 'Onboarding', 'Ledger', 'Pricing', 'Event bus', 'Audit log', 'Payments', 'ADR-031', 'Catalog', 'Consent', 'SLA 99.9', 'Invoice', 'Partner', 'Search', 'Tenant', 'Retention', 'ADR-007', 'Fulfilment', 'Policy', 'KYC', 'Routing', 'Schema v3'];
    const rels = ['realizes', 'depends on', 'governs', 'owns', 'part of', 'informs', 'implements', 'constrains', 'supersedes', 'relates to'];
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const cPool = shuffle(concepts), ePool = shuffle(entities);

    const hubs = [], nodes = [], edges = [];
    const ZW = Math.round(W * 0.3);
    const zones = [
      { x: (W - ZW) / 2, y: (H - 100) / 2 - 20, w: ZW, h: 100 },
      { x: (W - ZW) / 2, y: H - 50 - 18, w: ZW, h: 50 },
    ];
    const inZone = (x, y, pad) => zones.some(z => x > z.x - pad && x < z.x + z.w + pad && y > z.y - pad && y < z.y + z.h + pad);
    const step = W / nHub;
    for (let i = 0; i < nHub; i++) {
      let hx, hy, ok = false;
      for (let k = 0; k < 30 && !ok; k++) { hx = step * (i + 0.5) + (rnd() - 0.5) * step * 0.4; hy = H * (0.1 + rnd() * 0.8); ok = !inZone(hx, hy, 36); }
      if (!ok) continue;
      const h = { x: hx, y: hy, r: 5 + rnd() * 2.5, hub: true, col: pick(hubCols), label: cPool[i % cPool.length] };
      hubs.push(h); nodes.push(h);
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let ei = 0;
    hubs.forEach(h => {
      const n = Math.max(2, kids - 1 + Math.floor(rnd() * 3));
      for (let i = 0; i < n; i++) {
        const ang = rnd() * Math.PI * 2, rad = 50 + rnd() * 70;
        const c = { x: h.x + Math.cos(ang) * rad * 1.3, y: clamp(h.y + Math.sin(ang) * rad * 0.8, 16, H - 16), r: 2 + rnd() * 1.6, col: h.col, parent: h, label: rnd() < 0.55 ? ePool[ei++ % ePool.length] : null };
        if (inZone(c.x, c.y, 14) || c.x < 12 || c.x > W - 12) continue;
        nodes.push(c); edges.push({ a: h, b: c, kind: 'own', rel: rnd() < 0.3 ? pick(rels) : null });
      }
    });
    // concept-to-concept semantic links
    for (let i = 0; i < hubs.length - 1; i++) {
      edges.push({ a: hubs[i], b: hubs[i + 1], kind: 'core', rel: pick(rels) });
      if (i < hubs.length - 2 && rnd() < 0.35) edges.push({ a: hubs[i], b: hubs[i + 2], kind: 'core', rel: pick(rels) });
    }
    // cross-links between entities of different concepts
    const leaves = nodes.filter(n => !n.hub);
    for (let k = 0, tries = 0; k < cross && tries < 400; tries++) {
      const a = pick(leaves), b = pick(leaves);
      if (a.parent === b.parent) continue;
      const d = Math.abs(a.x - b.x); if (d > step * 1.8 || d < 60) continue;
      edges.push({ a, b, kind: 'cross', rel: rnd() < 0.3 ? pick(rels) : null }); k++;
    }
    const qp = (e, t) => { const u = 1 - t; return { x: u * u * e.a.x + 2 * u * t * e.c.x + t * t * e.b.x, y: u * u * e.a.y + 2 * u * t * e.c.y + t * t * e.b.y }; };
    const keep = edges.filter(e => {
      const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2, dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, L = Math.hypot(dx, dy) || 1;
      const base = (e.kind === 'core' ? 0.12 : e.kind === 'cross' ? 0.22 : 0.06) * (rnd() < 0.5 ? -1 : 1);
      e.L = L;
      for (const m of [1, -1, 2.5, -2.5]) {
        const bend = base * m * L;
        e.c = { x: mx - dy / L * bend, y: clamp(my + dx / L * bend, 4, H - 4) };
        let clear = true;
        for (let k = 0; k <= 16 && clear; k++) { const p = qp(e, k / 16); if (inZone(p.x, p.y, 10)) clear = false; }
        if (clear) return true;
      }
      return false;
    });
    edges.length = 0; edges.push(...keep);
    const linked = new Set(); edges.forEach(e => { linked.add(e.a); linked.add(e.b); });
    const liveNodes = nodes.filter(n => n.hub || linked.has(n)); nodes.length = 0; nodes.push(...liveNodes);

    // static layer
    const bg = document.createElement('canvas'); bg.width = W * dpr; bg.height = H * dpr;
    const b = bg.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0);
    edges.forEach(e => {
      b.beginPath(); b.moveTo(e.a.x, e.a.y); b.quadraticCurveTo(e.c.x, e.c.y, e.b.x, e.b.y);
      if (e.kind === 'core') { b.strokeStyle = `rgba(${e.a.col},0.30)`; b.lineWidth = 1; b.setLineDash([]); }
      else if (e.kind === 'cross') { b.strokeStyle = `rgba(${GREY},0.14)`; b.lineWidth = 1; b.setLineDash([3, 4]); }
      else { b.strokeStyle = `rgba(${GREY},0.18)`; b.lineWidth = 0.8; b.setLineDash([]); }
      b.stroke();
      // arrowhead near target
      const p = qp(e, 0.86), q = qp(e, 0.9), ang = Math.atan2(q.y - p.y, q.x - p.x);
      b.setLineDash([]); b.fillStyle = e.kind === 'core' ? `rgba(${e.a.col},0.45)` : `rgba(${GREY},0.3)`;
      b.beginPath(); b.moveTo(q.x, q.y); b.lineTo(q.x - Math.cos(ang - 0.45) * 5, q.y - Math.sin(ang - 0.45) * 5); b.lineTo(q.x - Math.cos(ang + 0.45) * 5, q.y - Math.sin(ang + 0.45) * 5); b.closePath(); b.fill();
    });

    nodes.forEach(n => {
      if (n.hub) {
        const g = b.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 5);
        g.addColorStop(0, `rgba(${n.col},0.14)`); g.addColorStop(1, `rgba(${n.col},0)`);
        b.fillStyle = g; b.beginPath(); b.arc(n.x, n.y, n.r * 5, 0, 6.283); b.fill();
        b.fillStyle = '#0A0A0B'; b.beginPath(); b.arc(n.x, n.y, n.r + 3, 0, 6.283); b.fill();
        b.strokeStyle = `rgba(${n.col},0.35)`; b.lineWidth = 1; b.beginPath(); b.arc(n.x, n.y, n.r + 3, 0, 6.283); b.stroke();
        b.fillStyle = `rgba(${n.col},0.8)`; b.beginPath(); b.arc(n.x, n.y, n.r, 0, 6.283); b.fill();
      } else {
        b.fillStyle = '#0A0A0B'; b.beginPath(); b.arc(n.x, n.y, n.r + 1.5, 0, 6.283); b.fill();
        b.strokeStyle = `rgba(${n.col},0.5)`; b.lineWidth = 1; b.beginPath(); b.arc(n.x, n.y, n.r, 0, 6.283); b.stroke();
      }
    });
    if (this.props.guides) { b.setLineDash([4, 4]); b.strokeStyle = 'rgba(46,168,98,0.5)'; b.lineWidth = 1; zones.forEach(z => b.strokeRect(z.x + 0.5, z.y + 0.5, z.w, z.h)); b.setLineDash([]); }
    // labels with collision avoidance: hubs → entities → relations
    const placed = zones.map(z => ({ x: z.x - 8, y: z.y - 8, w: z.w + 16, h: z.h + 16 }));
    const PAD = 4;
    const hits = (r) => {
      if (r.x < 4 || r.x + r.w > W - 4 || r.y < 2 || r.y + r.h > H - 2) return true;
      if (placed.some(p => r.x < p.x + p.w + PAD && r.x + r.w + PAD > p.x && r.y < p.y + p.h + PAD && r.y + r.h + PAD > p.y)) return true;
      return nodes.some(n => { if (r.owner === n) return false; const m = (n.hub ? n.r + 3 : n.r) + 8; const cx = Math.max(r.x, Math.min(n.x, r.x + r.w)), cy = Math.max(r.y, Math.min(n.y, r.y + r.h)); return Math.hypot(n.x - cx, n.y - cy) < m; });
    };
    const tryPlace = (cands) => { for (const r of cands) if (!hits(r)) { placed.push(r); return r; } return null; };
    b.textBaseline = 'middle'; b.textAlign = 'left';
    b.font = '500 12px "Inter Tight", system-ui, sans-serif';
    hubs.forEach(n => {
      const w = b.measureText(n.label).width, h = 14, o = n.r + 7;
      const r = tryPlace([
        { x: n.x + o, y: n.y - o - h / 2 - 2, w, h, owner: n },
        { x: n.x + o, y: n.y + o - h / 2 + 2, w, h, owner: n },
        { x: n.x - o - w, y: n.y - o - h / 2 - 2, w, h, owner: n },
        { x: n.x - o - w, y: n.y + o - h / 2 + 2, w, h, owner: n },
      ]);
      if (r) { b.fillStyle = 'rgba(230,232,234,0.55)'; b.fillText(n.label, r.x, r.y + h / 2); }
    });
    b.font = '400 10px "JetBrains Mono", ui-monospace, monospace';
    nodes.filter(n => !n.hub && n.label).forEach(n => {
      const w = b.measureText(n.label).width, h = 11, o = n.r + 5;
      const r = tryPlace([
        { x: n.x + o, y: n.y - h / 2, w, h, owner: n },
        { x: n.x - o - w, y: n.y - h / 2, w, h, owner: n },
        { x: n.x - w / 2, y: n.y - o - h, w, h, owner: n },
        { x: n.x - w / 2, y: n.y + o, w, h, owner: n },
      ]);
      if (r) { b.fillStyle = `rgba(${GREY},0.34)`; b.fillText(n.label, r.x, r.y + h / 2); }
    });
    if (showRel) {
      b.font = 'italic 400 9px "JetBrains Mono", ui-monospace, monospace';
      edges.filter(e => e.rel && e.L > 90).sort((x, y) => (y.kind === 'core') - (x.kind === 'core')).forEach(e => {
        const w = b.measureText(e.rel).width + 6, h = 12;
        const r = tryPlace([0.5, 0.4, 0.6].map(t => { const m = qp(e, t); return { x: m.x - w / 2, y: m.y - h / 2, w, h }; }));
        if (!r) return;
        b.fillStyle = '#0A0A0B'; b.fillRect(r.x, r.y, r.w, r.h);
        b.fillStyle = `rgba(${GREY},${e.kind === 'core' ? 0.42 : 0.28})`; b.fillText(e.rel, r.x + 3, r.y + h / 2);
      });
    }

    // traversal pulses: a query hops along edges
    const spawn = () => { const e = pick(edges); return { e, t: 0, v: 0.004 + rnd() * 0.004, rev: rnd() < 0.5 }; };
    const pulses = Array.from({ length: density === 'dense' ? 18 : density === 'sparse' ? 7 : 12 }, () => { const p = spawn(); p.t = rnd(); return p; });
    const lit = new Map();
    let t = 0;
    const frame = () => {
      t += 0.016;
      ctx.clearRect(0, 0, W, H); ctx.drawImage(bg, 0, 0, W, H);
      lit.forEach((a, n) => {
        ctx.strokeStyle = `rgba(${n.col},${(0.5 * a).toFixed(3)})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(n.x, n.y, (n.hub ? n.r + 3 : n.r) + (1 - a) * 8, 0, 6.283); ctx.stroke();
        a -= 0.02; a <= 0 ? lit.delete(n) : lit.set(n, a);
      });
      pulses.forEach((p, i) => {
        if (animate) p.t += p.v * (300 / Math.max(120, p.e.L));
        if (p.t >= 1) {
          const end = p.rev ? p.e.a : p.e.b; lit.set(end, 1);
          const next = edges.filter(e => e !== p.e && (e.a === end || e.b === end));
          if (next.length && rnd() < 0.75) { const e = pick(next); pulses[i] = { e, t: 0, v: p.v, rev: e.b === end }; }
          else pulses[i] = spawn();
          return;
        }
        const col = p.e.kind === 'core' || p.e.kind === 'own' ? p.e.a.col : GREEN;
        const pos = k => qp(p.e, p.rev ? 1 - k : k);
        for (let k = 1; k <= 8; k++) { const q = pos(Math.max(0, p.t - k * 0.012)); ctx.fillStyle = `rgba(${col},${(0.2 * (1 - k / 9)).toFixed(3)})`; ctx.beginPath(); ctx.arc(q.x, q.y, 1.2, 0, 6.283); ctx.fill(); }
        const h = pos(p.t); ctx.fillStyle = `rgba(${col},0.85)`; ctx.beginPath(); ctx.arc(h.x, h.y, 1.8, 0, 6.283); ctx.fill();
      });
      if (animate) this.raf = requestAnimationFrame(frame);
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(frame);
  }
}
</script>
</body>
</html>
